<script>
/**
 * ============================================================================
 * 🌕 21th Birthday Trip — Interactive Anime Web Game
 * Aesthetic: Makoto Shinkai ("Your Name") & Yuki Midorikawa ("Natsume Yuujinchou")
 * ============================================================================
 */

/* ----------------------------------------------------------------------------
 * 1. PROCEDURAL WEB AUDIO API SOUNDSCAPE ENGINE
 * Synthesizes gentle breeze, rustling leaves, bird chirps, train clack-clack,
 * ocean waves, furin wind chimes, emotional piano, and fireworks.
 * ---------------------------------------------------------------------------- */
class AnimeSoundEngine {
  constructor() {
    this.ctx = null;
    this.isMuted = true;
    this.masterGain = null;
    this.currentMode = 'fukuoka';
    this.noiseNodes = {};
  }

  init() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AudioCtx();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.0;
    this.masterGain.connect(this.ctx.destination);

    this.setupContinuousBreeze();
    this.startAmbientLoop();
  }

  toggle() {
    if (!this.ctx) this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.isMuted = !this.isMuted;
    const now = this.ctx.currentTime;
    this.masterGain.gain.cancelScheduledValues(now);
    this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.7, now, 0.35);
    return !this.isMuted;
  }

  ensureUnmuted() {
    if (!this.ctx) this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (this.isMuted) {
      this.isMuted = false;
      const now = this.ctx.currentTime;
      this.masterGain.gain.setTargetAtTime(0.7, now, 0.4);
    }
    updateAudioUI();
  }

  setMode(mode) {
    this.currentMode = mode;
  }

  createPinkNoiseBuffer(seconds = 4) {
    const bufferSize = this.ctx.sampleRate * seconds;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = buffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
      output[i] *= 0.04;
      b6 = white * 0.115926;
    }
    return buffer;
  }

  setupContinuousBreeze() {
    const buffer = this.createPinkNoiseBuffer(5);
    const windSrc = this.ctx.createBufferSource();
    windSrc.buffer = buffer;
    windSrc.loop = true;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 340;
    filter.Q.value = 0.8;

    const windGain = this.ctx.createGain();
    windGain.gain.value = 0.22;

    const lfo = this.ctx.createOscillator();
    lfo.frequency.value = 0.14;
    const lfoGain = this.ctx.createGain();
    lfoGain.gain.value = 140;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);

    windSrc.connect(filter);
    filter.connect(windGain);
    windGain.connect(this.masterGain);

    windSrc.start();
    lfo.start();
    this.noiseNodes.windGain = windGain;
  }

  playBirdChirp() {
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const notes = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < notes; i++) {
      const t = now + i * 0.14;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      const baseFreq = 2200 + Math.random() * 900;
      osc.frequency.setValueAtTime(baseFreq, t);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.28, t + 0.06);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.92, t + 0.12);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.032, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);

      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(t);
      osc.stop(t + 0.13);
    }
  }

  playLeafRustle() {
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const buffer = this.createPinkNoiseBuffer(1.2);
    const src = this.ctx.createBufferSource();
    src.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 1800;

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.08, now + 0.35);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.15);

    src.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    src.start(now);
    src.stop(now + 1.2);
  }

  playTrainClack() {
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    [0, 0.16].forEach((offset, idx) => {
      const t = now + offset;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(idx === 0 ? 95 : 82, t);
      osc.frequency.exponentialRampToValueAtTime(38, t + 0.08);

      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(t);
      osc.stop(t + 0.1);
    });
  }

  playTrainWhistle() {
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    [587.33, 739.99].forEach(freq => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * 0.98, now);
      osc.frequency.linearRampToValueAtTime(freq, now + 0.2);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.04, now + 0.18);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);

      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 1.15);
    });
  }

  playOceanWave() {
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const buffer = this.createPinkNoiseBuffer(3.8);
    const src = this.ctx.createBufferSource();
    src.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(220, now);
    filter.frequency.linearRampToValueAtTime(680, now + 1.6);
    filter.frequency.linearRampToValueAtTime(180, now + 3.7);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.24, now + 1.5);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 3.75);

    src.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    src.start(now);
    src.stop(now + 3.8);
  }

  playFurinChime() {
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const bellNotes = [1567.98, 2093.00, 2349.32, 2637.02];
    const f1 = bellNotes[Math.floor(Math.random() * bellNotes.length)];
    [f1, f1 * 1.505].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(i === 0 ? 0.055 : 0.02, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);

      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 1.45);
    });
  }

  playPianoNote(freq, duration = 2.2) {
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc2.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    osc2.frequency.setValueAtTime(freq * 2, now);

    const subGain = this.ctx.createGain();
    subGain.gain.value = 0.18;
    osc2.connect(subGain);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.075, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    osc.connect(gain);
    subGain.connect(gain);
    gain.connect(this.masterGain);

    osc.start(now);
    osc2.start(now);
    osc.stop(now + duration + 0.05);
    osc2.stop(now + duration + 0.05);
  }

  playFireworkBoom() {
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(115, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.65);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(now);
    osc.stop(now + 0.72);

    const buffer = this.createPinkNoiseBuffer(1.1);
    const src = this.ctx.createBufferSource();
    src.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1400;
    const nGain = this.ctx.createGain();
    nGain.gain.setValueAtTime(0.14, now + 0.03);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);

    src.connect(filter);
    filter.connect(nGain);
    nGain.connect(this.masterGain);
    src.start(now + 0.03);
    src.stop(now + 1.0);
  }

  playPop() {
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.09);
    gain.gain.setValueAtTime(0.04, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(now);
    osc.stop(now + 0.12);
  }

  startAmbientLoop() {
    let step = 0;
    const pianoScale = [
      349.23, 440.00, 523.25, 659.25,
      293.66, 349.23, 440.00, 523.25,
      233.08, 349.23, 440.00, 587.33,
      261.63, 392.00, 493.88, 523.25
    ];

    setInterval(() => {
      if (!this.ctx || this.isMuted) return;
      step++;

      if (['fukuoka', 'station', 'fuji', 'shrine', 'suwa'].includes(this.currentMode) && step % 5 === 0) {
        this.playLeafRustle();
      }

      if (['fukuoka', 'station', 'fuji', 'kamakura', 'shrine'].includes(this.currentMode) && step % 4 === 1) {
        if (Math.random() > 0.35) this.playBirdChirp();
      }

      if (this.currentMode === 'train' || this.currentMode === 'station_train') {
        this.playTrainClack();
      }

      if (this.currentMode === 'kamakura' && step % 4 === 0) {
        this.playOceanWave();
      }

      if (this.currentMode === 'shrine' && step % 3 === 0) {
        this.playFurinChime();
      }

      if (this.currentMode === 'suwa_hanabi' && step % 2 === 0) {
        const note = pianoScale[(step / 2) % pianoScale.length];
        this.playPianoNote(note, 2.4);
      }
    }, 850);
  }
}

/* ----------------------------------------------------------------------------

const canvas = document.getElementById('worldCanvas');
const ctx = canvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const petals = Array.from({ length: 34 }, () => ({
  x: Math.random() * 1600,
  y: Math.random() * 900,
  size: 4 + Math.random() * 5,
  speedX: 0.6 + Math.random() * 1.1,
  speedY: 0.4 + Math.random() * 0.8,
  angle: Math.random() * Math.PI * 2,
  spin: (Math.random() - 0.5) * 0.04,
  color: Math.random() > 0.45 ? '#F6D2DC' : '#F5AAC8'
}));

const clouds = Array.from({ length: 7 }, (_, i) => ({
  x: i * 280,
  y: 60 + (i % 3) * 55,
  scale: 0.7 + (i % 4) * 0.25,
  speed: 0.15 + (i % 3) * 0.08
}));

const stars = Array.from({ length: 90 }, () => ({
  x: Math.random(),
  y: Math.random() * 0.65,
  r: 0.8 + Math.random() * 1.8,
  phase: Math.random() * Math.PI * 2
}));

let fireworks = [];
let fireworkSparks = [];

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawAnimeClouds(tint = '#FFFAF2', shadowTint = '#BADBF0') {
  clouds.forEach(cl => {
    cl.x += cl.speed;
    if (cl.x > W + 220) cl.x = -240;

    ctx.save();
    ctx.translate(cl.x, cl.y);
    ctx.scale(cl.scale, cl.scale);

    ctx.fillStyle = shadowTint;
    ctx.beginPath();
    ctx.arc(0, 12, 42, 0, Math.PI * 2);
    ctx.arc(38, 14, 34, 0, Math.PI * 2);
    ctx.arc(-36, 15, 30, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = tint;
    ctx.beginPath();
    ctx.arc(0, 0, 44, 0, Math.PI * 2);
    ctx.arc(36, 4, 35, 0, Math.PI * 2);
    ctx.arc(-35, 6, 32, 0, Math.PI * 2);
    ctx.arc(16, -16, 30, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  });
}

function drawSunbeams(sunX, sunY, color = 'rgba(255, 250, 242, 0.24)') {
  ctx.save();
  const grad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, Math.max(W, H) * 0.65);
  grad.addColorStop(0, 'rgba(255, 250, 242, 0.75)');
  grad.addColorStop(0.25, color);
  grad.addColorStop(1, 'rgba(255, 250, 242, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255, 250, 242, 0.08)';
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(sunX, sunY);
    ctx.lineTo(sunX + 180 + i * 160, H);
    ctx.lineTo(sunX + 290 + i * 160, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawPetals(t) {
  petals.forEach(p => {
    p.x += p.speedX + Math.sin(t * 1.5 + p.angle) * 0.4;
    p.y += p.speedY;
    p.angle += p.spin;
    if (p.x > W + 20) p.x = -20;
    if (p.y > H + 20) {
      p.y = -20;
      p.x = Math.random() * W;
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawRusticBouquet(c, x, y, scale = 1) {
  c.save();
  c.translate(x, y);
  c.scale(scale, scale);

  c.fillStyle = '#D6BE9C';
  c.beginPath();
  c.moveTo(0, 18);
  c.lineTo(-18, -14);
  c.lineTo(18, -14);
  c.closePath();
  c.fill();
  c.strokeStyle = '#8A7869';
  c.lineWidth = 1.2;
  c.stroke();

  c.strokeStyle = '#F5AAC8';
  c.lineWidth = 2.5;
  c.beginPath();
  c.moveTo(-6, 6);
  c.lineTo(6, 6);
  c.stroke();

  c.fillStyle = '#DDEFCA';
  [[-12, -16], [12, -15], [-4, -22], [6, -21]].forEach(([dx, dy]) => {
    c.beginPath();
    c.arc(dx, dy, 4, 0, Math.PI * 2);
    c.fill();
  });

  [[-8, -13], [9, -12]].forEach(([rx, ry]) => {
    c.fillStyle = '#FFFAF2';
    c.beginPath();
    c.arc(rx, ry, 6.5, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#F6D2DC';
    c.lineWidth = 1;
    c.stroke();
  });

  [[0, -16], [-5, -9]].forEach(([sx, sy]) => {
    c.fillStyle = '#F7C948';
    for (let a = 0; a < 10; a++) {
      const ang = (a / 10) * Math.PI * 2;
      c.beginPath();
      c.ellipse(sx + Math.cos(ang) * 6, sy + Math.sin(ang) * 6, 3.5, 1.8, ang, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = '#6B4C35';
    c.beginPath();
    c.arc(sx, sy, 3.8, 0, Math.PI * 2);
    c.fill();
  });

  c.restore();
}

function drawChibiBoy(c, x, y, opts = {}) {
  const {
    scale = 1,
    facing = 1,
    sitting = false,
    walking = false,
    happy = false,
    yukata = GAME_STATE.yukataStyle,
    holdBouquet = GAME_STATE.hasBouquet,
    t = 0
  } = opts;

  const bob = walking ? Math.abs(Math.sin(t * 8)) * 4 : Math.sin(t * 2.5) * 1.8;

  c.save();
  c.translate(x, y - bob);
  c.scale(scale, scale);

  c.fillStyle = 'rgba(87, 90, 96, 0.16)';
  c.beginPath();
  c.ellipse(0, sitting ? 26 : 44, 22, 6, 0, 0, Math.PI * 2);
  c.fill();

  if (!sitting) {
    const legSwing = walking ? Math.sin(t * 8) * 5 : 0;
    c.fillStyle = yukata ? '#8A7869' : '#575A60';
    roundRect(c, -11, 20 + legSwing * 0.4, 8, 20, 4);
    c.fill();
    roundRect(c, 3, 20 - legSwing * 0.4, 8, 20, 4);
    c.fill();

    c.fillStyle = yukata ? '#D6BE9C' : '#FFFAF2';
    roundRect(c, -13, 38 + legSwing * 0.4, 11, 6, 3);
    c.fill();
    roundRect(c, 2, 38 - legSwing * 0.4, 11, 6, 3);
    c.fill();
  } else {
    c.fillStyle = yukata ? yukata.mainColor : '#575A60';
    roundRect(c, -14, 14, 28, 12, 6);
    c.fill();
  }

  if (yukata) {
    c.fillStyle = yukata.mainColor;
    c.beginPath();
    c.moveTo(-16, -6);
    c.lineTo(16, -6);
    c.lineTo(20, 26);
    c.lineTo(-20, 26);
    c.closePath();
    c.fill();

    c.strokeStyle = yukata.accentColor;
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(-7, -6);
    c.lineTo(0, 7);
    c.lineTo(7, -6);
    c.stroke();

    c.fillStyle = yukata.obiColor;
    roundRect(c, -17, 10, 34, 6, 2);
    c.fill();
  } else {
    c.fillStyle = '#FFFAF2';
    roundRect(c, -14, -6, 28, 28, 8);
    c.fill();

    c.fillStyle = '#97B6E0';
    roundRect(c, -16, -6, 10, 28, 5);
    c.fill();
    roundRect(c, 6, -6, 10, 28, 5);
    c.fill();
  }

  c.fillStyle = yukata ? yukata.mainColor : '#97B6E0';
  roundRect(c, -21, -4, 7, 18, 4);
  c.fill();
  roundRect(c, 14, -4, 7, 18, 4);
  c.fill();

  c.fillStyle = '#FFE9D6';
  c.beginPath();
  c.arc(0, -24, 21, 0, Math.PI * 2);
  c.fill();

  c.fillStyle = '#4A4448';
  c.beginPath();
  c.arc(0, -27, 22, Math.PI * 0.92, Math.PI * 2.08);
  c.lineTo(18, -20);
  c.lineTo(11, -26);
  c.lineTo(5, -19);
  c.lineTo(-1, -26);
  c.lineTo(-8, -19);
  c.lineTo(-14, -25);
  c.lineTo(-20, -19);
  c.closePath();
  c.fill();

  c.strokeStyle = 'rgba(186, 219, 240, 0.55)';
  c.lineWidth = 2;
  c.beginPath();
  c.arc(0, -29, 15, Math.PI * 1.2, Math.PI * 1.8);
  c.stroke();

  if (facing !== 0) {
    const eyeShift = facing * 2.5;
    c.fillStyle = 'rgba(245, 170, 200, 0.45)';
    c.beginPath();
    c.ellipse(-10 + eyeShift, -19, 3.5, 2, 0, 0, Math.PI * 2);
    c.ellipse(10 + eyeShift, -19, 3.5, 2, 0, 0, Math.PI * 2);
    c.fill();

    c.strokeStyle = '#3D373B';
    c.fillStyle = '#3D373B';
    c.lineWidth = 2;
    if (happy) {
      c.beginPath();
      c.arc(-7 + eyeShift, -23, 3, Math.PI, 0);
      c.stroke();
      c.beginPath();
      c.arc(7 + eyeShift, -23, 3, Math.PI, 0);
      c.stroke();
    } else {
      c.beginPath();
      c.arc(-7 + eyeShift, -23, 2.5, 0, Math.PI * 2);
      c.arc(7 + eyeShift, -23, 2.5, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#FFFFFF';
      c.beginPath();
      c.arc(-7.8 + eyeShift, -23.8, 0.9, 0, Math.PI * 2);
      c.arc(6.2 + eyeShift, -23.8, 0.9, 0, Math.PI * 2);
      c.fill();
    }

    c.strokeStyle = '#8A7869';
    c.lineWidth = 1.6;
    c.beginPath();
    c.arc(eyeShift, -18, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
    c.stroke();
  }

  if (holdBouquet) {
    drawRusticBouquet(c, 16, 8, 0.82);
  }

  c.restore();
}

  c.fill();

  c.arc(-6.7, -23.7, 0.8, 0, Math.PI * 2);

// SCENE 0: Fukuoka Bright Morning Cityscape
function renderFukuokaMorning(t) {
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.72);
  sky.addColorStop(0, '#7A9FDC');
  sky.addColorStop(0.55, '#BADBF0');
  sky.addColorStop(1, '#FFFAF2');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  drawSunbeams(W * 0.82, H * 0.16);
  drawAnimeClouds('#FFFAF2', '#C4E7E6');

  const horizon = H * 0.68;
  const buildings = [
    { x: 0.04, w: 0.08, h: 0.22, col: '#BDDBDC' },
    { x: 0.11, w: 0.07, h: 0.28, col: '#97B6E0' },
    { x: 0.19, w: 0.09, h: 0.19, col: '#F6EAD4' },
    { x: 0.30, w: 0.06, h: 0.26, col: '#C4E7E6' },
    { x: 0.65, w: 0.08, h: 0.24, col: '#97B6E0' },
    { x: 0.74, w: 0.10, h: 0.30, col: '#BDDBDC' },
    { x: 0.85, w: 0.09, h: 0.21, col: '#F6D2DC' }
  ];
  buildings.forEach(b => {
    ctx.fillStyle = b.col;
    roundRect(ctx, W * b.x, horizon - H * b.h, W * b.w, H * b.h + 10, 6);
    ctx.fill();
  });

  ctx.fillStyle = '#97B6E0';
  ctx.beginPath();
  ctx.moveTo(W * 0.25, horizon);
  ctx.lineTo(W * 0.265, horizon - H * 0.38);
  ctx.lineTo(W * 0.28, horizon);
  ctx.closePath();
  ctx.fill();

  const waterGrad = ctx.createLinearGradient(0, horizon, 0, H * 0.78);
  waterGrad.addColorStop(0, '#97B6E0');
  waterGrad.addColorStop(1, '#C4E7E6');
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, horizon, W, H * 0.1);

  ctx.strokeStyle = 'rgba(255, 250, 242, 0.65)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 14; i++) {
    const rx = ((i * 130 + t * 25) % (W + 100)) - 50;
    const ry = horizon + 10 + (i % 4) * 12;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + 36, ry);
    ctx.stroke();
  }

  ctx.fillStyle = '#F5F1E8';
  ctx.fillRect(0, H * 0.77, W, H * 0.23);
  ctx.fillStyle = '#DDEFCA';
  ctx.fillRect(0, H * 0.77, W, 10);

  [[W * 0.1, H * 0.77], [W * 0.9, H * 0.77]].forEach(([tx, ty]) => {
    ctx.fillStyle = '#8A7869';
    ctx.fillRect(tx - 6, ty - 95, 12, 95);
    ctx.fillStyle = '#F6D2DC';
    ctx.beginPath();
    ctx.arc(tx, ty - 115, 58, 0, Math.PI * 2);
    ctx.arc(tx - 38, ty - 95, 42, 0, Math.PI * 2);
    ctx.arc(tx + 38, ty - 95, 42, 0, Math.PI * 2);
    ctx.fill();
  });

  drawChibiBoy(ctx, W * 0.5, H * 0.68, { scale: 1.15, happy: true, t });
  drawPetals(t);
}

// SCENE 0B: Declined ("No") Starry Night Ending
function renderDeclinedNight(t) {
  const night = ctx.createLinearGradient(0, 0, 0, H);
  night.addColorStop(0, '#2C3954');
  night.addColorStop(0.55, '#575A60');
  night.addColorStop(1, '#7A9FDC');
  ctx.fillStyle = night;
  ctx.fillRect(0, 0, W, H);

  stars.forEach(s => {
    const alpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + s.phase));
    ctx.fillStyle = `rgba(255, 250, 242, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  const moonX = W * 0.5;
  const moonY = H * 0.24;
  const halo = ctx.createRadialGradient(moonX, moonY, 15, moonX, moonY, 140);
  halo.addColorStop(0, 'rgba(255, 250, 242, 0.85)');
  halo.addColorStop(0.4, 'rgba(246, 234, 212, 0.28)');
  halo.addColorStop(1, 'rgba(246, 234, 212, 0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(moonX, moonY, 140, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFFAF2';
  ctx.beginPath();
  ctx.arc(moonX, moonY, 44, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3B465E';
  ctx.fillRect(0, H * 0.76, W, H * 0.24);

  drawChibiBoy(ctx, W * 0.5, H * 0.74, { scale: 1.25, happy: true, t });
}

// SCENE 1: Hakata / Fukuoka Morning Train Station & Train Arrival
function renderStationArrival(t) {
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.7);
  sky.addColorStop(0, '#7A9FDC');
  sky.addColorStop(0.6, '#BADBF0');
  sky.addColorStop(1, '#FFFAF2');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  drawSunbeams(W * 0.2, H * 0.14);
  drawAnimeClouds('#FFFAF2', '#C4E7E6');

  ctx.fillStyle = '#C2C395';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.65);
  ctx.quadraticCurveTo(W * 0.3, H * 0.50, W * 0.65, H * 0.65);
  ctx.quadraticCurveTo(W * 0.85, H * 0.54, W, H * 0.65);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  const trackY = H * 0.68;
  ctx.fillStyle = '#8A7869';
  ctx.fillRect(0, trackY, W, 8);

  const targetTrainX = W * 0.18;
  if (GAME_STATE.trainX < targetTrainX) {
    GAME_STATE.trainX += (targetTrainX - GAME_STATE.trainX) * 0.045 + 1.8;
    if (GAME_STATE.trainX > targetTrainX) GAME_STATE.trainX = targetTrainX;
  }

  const tx = GAME_STATE.trainX;
  const ty = trackY - 96;
  ctx.save();
  ctx.fillStyle = '#FFFAF2';
  roundRect(ctx, tx, ty, Math.min(540, W * 0.66), 92, 18);
  ctx.fill();
  ctx.strokeStyle = '#7A9FDC';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.fillStyle = '#7A9FDC';
  ctx.fillRect(tx + 8, ty + 52, Math.min(524, W * 0.66 - 16), 12);
  ctx.fillStyle = '#F5AAC8';
  ctx.fillRect(tx + 8, ty + 66, Math.min(524, W * 0.66 - 16), 5);

  const carW = Math.min(540, W * 0.66);
  for (let wx = tx + 28; wx < tx + carW - 55; wx += 68) {
    ctx.fillStyle = '#C4E7E6';
    roundRect(ctx, wx, ty + 16, 44, 28, 6);
    ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle = '#F5F1E8';
  ctx.fillRect(0, H * 0.72, W, H * 0.28);
  ctx.fillStyle = '#F7C948';

// DESTINATION 4: Lake Suwa, Nagano (Twilight 18:00-19:00 & Hanabi Taikai)
function renderLakeSuwaScene(t) {
  const darkness = GAME_STATE.hanabiActive ? Math.min(1, GAME_STATE.hanabiTimer / 4) : 0.18;

  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.64);
  if (darkness < 0.5) {
    sky.addColorStop(0, '#575A60');
    sky.addColorStop(0.42, '#7A9FDC');
    sky.addColorStop(0.76, '#F5AAC8');
    sky.addColorStop(1, '#F6EAD4');
  } else {
    sky.addColorStop(0, '#1D273B');
    sky.addColorStop(0.55, '#354666');
    sky.addColorStop(0.88, '#7A9FDC');
    sky.addColorStop(1, '#F6D2DC');
  }
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  if (darkness > 0.35) {
    stars.forEach(s => {
      const a = (darkness - 0.35) * (0.5 + 0.5 * Math.sin(t * 2.2 + s.phase));
      ctx.fillStyle = `rgba(255, 250, 242, ${a})`;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H * 0.85, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  ctx.fillStyle = darkness > 0.5 ? '#2C3954' : '#7A9FDC';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.62);
  ctx.quadraticCurveTo(W * 0.25, H * 0.48, W * 0.52, H * 0.62);
  ctx.quadraticCurveTo(W * 0.78, H * 0.50, W, H * 0.62);
  ctx.lineTo(W, H * 0.66);
  ctx.lineTo(0, H * 0.66);
  ctx.closePath();
  ctx.fill();

  const lakeTop = H * 0.62;
  const lakeGrad = ctx.createLinearGradient(0, lakeTop, 0, H * 0.82);
  lakeGrad.addColorStop(0, darkness > 0.5 ? '#273652' : '#97B6E0');
  lakeGrad.addColorStop(1, darkness > 0.5 ? '#3C5075' : '#F6D2DC');
  ctx.fillStyle = lakeGrad;
  ctx.fillRect(0, lakeTop, W, H * 0.20);

  updateAndDrawFireworks();

  ctx.fillStyle = darkness > 0.6 ? '#2B363B' : '#8A7869';
  ctx.fillRect(0, H * 0.80, W, H * 0.20);

  const boySitX = W * 0.45;
  const boySitY = H * 0.81;
  drawChibiBoy(ctx, boySitX, boySitY, {
    scale: 1.28,
    sitting: true,
    facing: GAME_STATE.scrollReady ? 1 : 0,
    happy: true,
    t
  });

  if (GAME_STATE.girlVisible) {
    const targetGirlX = boySitX + 42;
    if (GAME_STATE.girlX > targetGirlX) {
      GAME_STATE.girlX -= (GAME_STATE.girlX - targetGirlX) * 0.05 + 1.1;
      if (GAME_STATE.girlX < targetGirlX) GAME_STATE.girlX = targetGirlX;
    }
    if (GAME_STATE.girlFading) {
      GAME_STATE.girlAlpha = Math.max(0, GAME_STATE.girlAlpha - 0.015);
    }
    drawChibiGirl(ctx, GAME_STATE.girlX, H * 0.79, {
      scale: 1.26,
      alpha: GAME_STATE.girlAlpha,
      t,
      speech: GAME_STATE.girlSpeech
    });
  }
}

/* ----------------------------------------------------------------------------
 * 4. FIREWORKS PARTICLE SYSTEM (CUSTOM SHAPES: HEART, STAR, RING, WILLOW)
 * ---------------------------------------------------------------------------- */
function launchFirework(x, targetY, shape = 'ring', color = '#F5AAC8', isCustom = false) {
  fireworks.push({
    x,
    y: H * 0.62,
    targetY,
    vy: -7.5 - Math.random() * 2,
    shape,
    color,
    isCustom
  });
}

function explodeFirework(fw) {
  sound.playFireworkBoom();
  const count = fw.isCustom ? 95 : 65;

  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    let vx = Math.cos(angle) * 3.4;
    let vy = Math.sin(angle) * 3.4;

    if (fw.shape === 'heart') {
      const t = angle;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      vx = hx * 0.24;
      vy = hy * 0.24;
    } else if (fw.shape === 'star') {
      const spike = i % 2 === 0 ? 4.4 : 1.9;
      vx = Math.cos(angle) * spike;
      vy = Math.sin(angle) * spike;
    } else if (fw.shape === 'willow') {
      const spd = 1.5 + Math.random() * 2.8;
      vx = Math.cos(angle) * spd;
      vy = Math.sin(angle) * spd - 0.6;
    }

    fireworkSparks.push({
      x: fw.x,
      y: fw.y,
      vx,
      vy,
      alpha: 1,
      decay: fw.shape === 'willow' ? 0.011 : 0.016,
      color: fw.color,
      size: fw.isCustom ? 3.2 : 2.4,
      gravity: fw.shape === 'willow' ? 0.055 : 0.03
    });
  }
}

function updateAndDrawFireworks() {
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const fw = fireworks[i];
    fw.y += fw.vy;
    fw.vy *= 0.985;

    ctx.fillStyle = fw.color;
    ctx.beginPath();
    ctx.arc(fw.x, fw.y, 3, 0, Math.PI * 2);
    ctx.fill();

    if (fw.y <= fw.targetY || fw.vy > -1.2) {
      explodeFirework(fw);
      fireworks.splice(i, 1);
    }
  }

  for (let i = fireworkSparks.length - 1; i >= 0; i--) {
    const sp = fireworkSparks[i];
    sp.x += sp.vx;
    sp.y += sp.vy;
    sp.vy += sp.gravity;
    sp.vx *= 0.985;
    sp.alpha -= sp.decay;

    if (sp.alpha <= 0) {
      fireworkSparks.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = sp.alpha;
    ctx.fillStyle = sp.color;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
    ctx.fill();

    if (sp.y < H * 0.62) {
      const reflY = H * 0.62 + (H * 0.62 - sp.y) * 0.35;
      if (reflY < H * 0.80) {
        ctx.globalAlpha = sp.alpha * 0.3;
        ctx.fillRect(sp.x - 4, reflY, 8, 1.8);
      }
    }
    ctx.restore();
  }
}

/* ----------------------------------------------------------------------------
 * 5. UI & SCENE FLOW CONTROLLER
 * ---------------------------------------------------------------------------- */
const uiLayer = document.getElementById('uiLayer');
const sceneSubtitle = document.getElementById('sceneSubtitle');

function updateAudioUI() {
  const icon = document.getElementById('audioIcon');
  const label = document.getElementById('audioLabel');
  if (sound.isMuted) {
    icon.textContent = '🔇';
    label.textContent = 'Sound Off';
  } else {
    icon.textContent = '🎶';
    label.textContent = 'Sound On';
  }
}

document.getElementById('audioToggleBtn').addEventListener('click', () => {
  const active = sound.toggle();
  updateAudioUI();
  if (active) sound.playPop();
});

function updateSouvenirHUD() {
  if (GAME_STATE.hasCake) document.getElementById('invCake').classList.remove('opacity-30');
  if (GAME_STATE.hasBouquet) document.getElementById('invBouquet').classList.remove('opacity-30');
  if (GAME_STATE.yukataStyle) document.getElementById('invYukata').classList.remove('opacity-30');
  if (GAME_STATE.furinHung) document.getElementById('invFurin').classList.remove('opacity-30');
}

function clearTimers() {
  if (GAME_STATE.countdownTimer) {
    clearInterval(GAME_STATE.countdownTimer);
    GAME_STATE.countdownTimer = null;
  }
}

function goToScene(sceneName) {
  clearTimers();
  GAME_STATE.scene = sceneName;
  uiLayer.innerHTML = '';

  if (sceneName === 'TITLE') {
    sceneSubtitle.textContent = 'Fukuoka Morning';
    sound.setMode('fukuoka');
    renderTitleUI();
  } else if (sceneName === 'DECLINED') {
    sceneSubtitle.textContent = 'Starry Fukuoka Night';
    sound.setMode('fukuoka');
    renderDeclinedUI();
  } else if (sceneName === 'STATION') {
    sceneSubtitle.textContent = 'Hakata Station • Morning Departure';
    sound.setMode('station_train');
    GAME_STATE.trainX = -560;
    GAME_STATE.boyX = W * 0.45;
    GAME_STATE.boyBoarded = false;
    renderStationUI();
  } else if (sceneName === 'TRAIN') {
    sceneSubtitle.textContent = 'Scenic Express • En Route';
    sound.setMode('train');
    renderTrainMapUI();
  } else if (sceneName === 'FUJI') {
    sceneSubtitle.textContent = 'Destination 1 • Mount Fuji';
    sound.setMode('fuji');
    renderMountFujiGameUI();
  } else if (sceneName === 'KAMAKURA') {
    sceneSubtitle.textContent = 'Destination 2 • Kamakura-Koko-Mae';
    sound.setMode('kamakura');
    renderKamakuraGameUI();
  } else if (sceneName === 'SHRINE') {
    sceneSubtitle.textContent = 'Destination 3 • Kawagoe Hikawa Shrine';
    sound.setMode('shrine');
    renderShrineSequenceUI();
  } else if (sceneName === 'SUWA') {
    sceneSubtitle.textContent = 'Destination 4 • Lake Suwa Hanabi Taikai';
    sound.setMode('suwa');
    GAME_STATE.girlVisible = false;
    GAME_STATE.girlX = W * 0.45 + 210;
    GAME_STATE.girlSpeech = '';
    GAME_STATE.girlFading = false;
    GAME_STATE.girlAlpha = 1;
    GAME_STATE.hanabiActive = false;
    GAME_STATE.hanabiTimer = 0;
    GAME_STATE.scrollReady = false;
    renderLakeSuwaCreatorUI();
  }
}

/* --- DESTINATION 1: MOUNT FUJI BLOCK STACKING MINI-GAME + CAKE --- */
function renderMountFujiGameUI() {
  const TARGET_BLOCKS = 8;
  let stack = [{ x: 90, w: 100, color: '#97B6E0' }];
  let current = { x: 15, w: 100, dir: 1, speed: 2.9 };
  let reachedPeak = false;
  let animId = null;

  const blockColors = ['#97B6E0', '#BADBF0', '#C4E7E6', '#DDEFCA', '#F6EAD4', '#F6D2DC', '#F5AAC8', '#FFFAF2'];

  uiLayer.innerHTML = `
    <div id="fujiCard" class="pointer-events-auto max-w-[330px] w-full px-3 py-2 text-center ml-auto mr-0 sm:mr-5 mt-auto mb-3 sm:my-auto"
         style="text-shadow: 0 2px 10px rgba(255, 250, 242, 0.96), 0 0 4px rgba(255, 255, 255, 0.96);">
      <h2 class="font-header text-base sm:text-lg font-bold text-[#575A60] mb-0.5">🗻 Climb Mount Fuji</h2>
      <p id="fujiPrompt" class="font-body text-xs font-medium text-[#575A60] mb-2">
        Stack 8 blocks to reach the snowy summit!
      </p>

      <div class="relative mx-auto w-[280px] max-w-full h-[200px] rounded-xl overflow-hidden bg-[#FFFAF2]/20 mb-2.5">
        <canvas id="fujiMiniCanvas" width="280" height="200" class="w-full h-full block"></canvas>
        <div class="absolute top-1.5 right-2 px-2 py-0.5 rounded-full bg-white/75 text-[11px] font-bold text-[#575A60]" style="text-shadow: none;">
          <span id="fujiHeightCount">0</span> / ${TARGET_BLOCKS}
        </div>
      </div>

      <div id="fujiControls" class="flex justify-center" style="text-shadow: none;">
        <button id="dropBlockBtn" class="anime-btn anime-btn-primary px-6 py-2 text-xs sm:text-sm font-semibold">
          Place Block 🧱
        </button>
      </div>
    </div>
  `;

  const mCanvas = document.getElementById('fujiMiniCanvas');
  const mCtx = mCanvas.getContext('2d');

  function drawMiniGame() {
    mCtx.clearRect(0, 0, 280, 200);

    mCtx.fillStyle = 'rgba(122, 159, 220, 0.22)';
    mCtx.beginPath();
    mCtx.moveTo(124, 24);
    mCtx.lineTo(156, 24);
    mCtx.lineTo(255, 196);
    mCtx.lineTo(25, 196);
    mCtx.closePath();
    mCtx.fill();

    mCtx.strokeStyle = '#8A7869';
    mCtx.lineWidth = 1.8;
    mCtx.beginPath();
    mCtx.moveTo(140, 8);
    mCtx.lineTo(140, 26);
    mCtx.stroke();
    mCtx.fillStyle = '#F5AAC8';
    mCtx.beginPath();
    mCtx.moveTo(140, 8);
    mCtx.lineTo(158, 13);
    mCtx.lineTo(140, 18);
    mCtx.closePath();
    mCtx.fill();

    const blockH = 18;
    stack.forEach((b, idx) => {
      const by = 196 - (idx + 1) * blockH;
      mCtx.fillStyle = b.color;
      roundRect(mCtx, b.x, by, b.w, blockH - 2, 5);
      mCtx.fill();
      mCtx.strokeStyle = '#FFFFFF';
      mCtx.lineWidth = 1;
      mCtx.stroke();
    });

    if (!reachedPeak) {
      current.x += current.dir * current.speed;
      if (current.x + current.w >= 274) {
        current.x = 274 - current.w;
        current.dir = -1;
      } else if (current.x <= 6) {
        current.x = 6;
        current.dir = 1;
      }
      const cy = 196 - (stack.length + 1) * blockH;
      mCtx.fillStyle = blockColors[stack.length % blockColors.length];
      roundRect(mCtx, current.x, cy, current.w, blockH - 2, 5);
      mCtx.fill();
      mCtx.strokeStyle = '#575A60';
      mCtx.lineWidth = 1;
      mCtx.stroke();
    }

    if (GAME_STATE.scene === 'FUJI' && !reachedPeak) {
      animId = requestAnimationFrame(drawMiniGame);
    }
  }
  animId = requestAnimationFrame(drawMiniGame);

  function placeBlock() {
    if (reachedPeak) return;
    sound.playPop();
    const prev = stack[stack.length - 1];
    const left = Math.max(prev.x, current.x);
    const right = Math.min(prev.x + prev.w, current.x + current.w);
    const overlap = right - left;

    if (overlap <= 10) {
      document.getElementById('fujiPrompt').textContent = 'Almost! Align with the block below ✨';
      current.x = 12;
      current.dir = 1;
      return;
    }

    const newW = Math.max(38, overlap);
    stack.push({
      x: left,
      w: newW,
      color: blockColors[stack.length % blockColors.length]
    });

    const climbed = stack.length - 1;
    document.getElementById('fujiHeightCount').textContent = climbed;

    if (climbed >= TARGET_BLOCKS) {
      reachedPeak = true;
      cancelAnimationFrame(animId);
      showFujiCakeReward();
    } else {
      current.w = newW;
      current.speed = Math.min(4.6, 2.9 + climbed * 0.22);
      current.x = climbed % 2 === 0 ? 10 : 270 - newW;
      current.dir = climbed % 2 === 0 ? 1 : -1;
    }
  }

  document.getElementById('dropBlockBtn').addEventListener('click', placeBlock);
  mCanvas.addEventListener('click', placeBlock);
}

/* --- DESTINATION 2: KAMAKURA-KOKO-MAE STATION + MINI SUDOKU + BOUQUET --- */
function renderKamakuraGameUI() {
  const solution = [
    [1, 2, 3, 4],
    [3, 4, 1, 2],
    [2, 1, 4, 3],
    [4, 3, 2, 1]
  ];
  const initial = [
    [1, 0, 3, 0],
    [0, 4, 0, 2],
    [2, 0, 4, 0],
    [0, 3, 0, 1]
  ];
  let board = initial.map(row => [...row]);
  let selectedCell = [0, 1];

  uiLayer.innerHTML = `
    <div id="kamakuraCard" class="pointer-events-auto max-w-[320px] w-full px-3 py-2 text-center ml-auto mr-0 sm:mr-5 mt-auto mb-3 sm:my-auto"
         style="text-shadow: 0 2px 10px rgba(255, 250, 242, 0.96), 0 0 4px rgba(255, 255, 255, 0.96);">
      <div class="font-body text-[11px] font-semibold text-[#8A7869] mb-1">
        🌊 Seaside Crossing
      </div>
      <h2 class="font-header text-base sm:text-lg font-bold text-[#575A60] mb-0.5">Kamakura Sudoku</h2>
      <p id="sudokuHint" class="font-body text-xs font-medium text-[#575A60] mb-2.5">
        Fill rows, columns & 2×2 boxes with 1–4 for a gift!
      </p>

      <div id="sudokuGrid" class="grid grid-cols-4 gap-1 w-44 h-44 mx-auto p-1.5 rounded-xl bg-[#97B6E0]/20 mb-2.5" style="text-shadow: none;"></div>

      <div class="flex justify-center gap-1.5" style="text-shadow: none;">
        ${[1, 2, 3, 4].map(n => `
          <button data-num="${n}" class="num-pad-btn anime-btn w-9 h-9 font-bold text-sm">${n}</button>
        `).join('')}
      </div>
    </div>
  `;

  function renderGrid() {
    const gridEl = document.getElementById('sudokuGrid');
    if (!gridEl) return;
    gridEl.innerHTML = '';

    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const fixed = initial[r][c] !== 0;
        const val = board[r][c];
        const isSel = selectedCell[0] === r && selectedCell[1] === c;
        const isWrong = val !== 0 && val !== solution[r][c];

        const boxTint = ((Math.floor(r / 2) + Math.floor(c / 2)) % 2 === 0) ? 'bg-[#FFFAF2]/75' : 'bg-[#F6EAD4]/75';

        const cell = document.createElement('button');
        cell.className = `rounded-lg font-bold text-sm flex items-center justify-center transition-all ${boxTint} ${
          fixed ? 'text-[#575A60] cursor-default' : isWrong ? 'text-rose-500' : 'text-[#7A9FDC]'
        } ${isSel ? 'ring-2 ring-[#F5AAC8] scale-105' : ''}`;
        cell.textContent = val === 0 ? '' : val;

        cell.addEventListener('click', () => {
          sound.playPop();
          selectedCell = [r, c];
          renderGrid();
        });
        gridEl.appendChild(cell);
      }
    }
  }

  function checkWin() {
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (board[r][c] !== solution[r][c]) return false;
      }
    }
    return true;
  }

  document.querySelectorAll('.num-pad-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const num = parseInt(btn.dataset.num, 10);
      const [r, c] = selectedCell;
      if (initial[r][c] !== 0) {
        document.getElementById('sudokuHint').textContent = 'Select an empty pastel tile first ✨';
        return;
      }
      sound.playPop();
      board[r][c] = num;
      renderGrid();

      if (checkWin()) {
        showKamakuraBouquetReward();
      }
    });
  });

  renderGrid();
}

/* ----------------------------------------------------------------------------
 * 6. MAIN ANIMATION LOOP
 * ---------------------------------------------------------------------------- */
let lastTime = 0;
// === REALISTIC AMBIENT BACKGROUND LAYER (NON-DESTRUCTIVE) ===
const AmbientBgSystem = (() => {
  const state = {
    initialized: false,
    time: 0,
    windBase: 18,       // kecepatan angin dasar (px/detik)
    windGust: 0,        // hembusan angin dinamis
    clouds: [],
    particles: [],
    sunRaysAlpha: 0.08
  };

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  // Gelombang organik gabungan (lebih natural daripada 1 sin saja)
  function organicWave(t, freq = 1, seed = 0) {
    return (
      Math.sin(t * freq + seed) * 0.62 +
      Math.cos(t * (freq * 1.93) + seed * 1.7) * 0.25 +
      Math.sin(t * (freq * 3.41) + seed * 0.6) * 0.13
    );
  }

  function init(width, height) {
    state.clouds = [];
    state.particles = [];

    // 3 lapisan kedalaman awan (jauh -> tengah -> dekat)
    const layers = [
      { count: 4, depth: 0.25, minW: 130, maxW: 220, alpha: 0.14, yMin: 0.06, yMax: 0.28 },
      { count: 4, depth: 0.55, minW: 170, maxW: 280, alpha: 0.22, yMin: 0.12, yMax: 0.36 },
      { count: 2, depth: 0.85, minW: 220, maxW: 340, alpha: 0.12, yMin: 0.18, yMax: 0.42 }
    ];

    layers.forEach((layer, lIdx) => {
      for (let i = 0; i < layer.count; i++) {
        const w = lerp(layer.minW, layer.maxW, Math.random());
        state.clouds.push({
          x: Math.random() * (width + 400) - 200,
          y: height * lerp(layer.yMin, layer.yMax, Math.random()),
          w,
          h: w * lerp(0.24, 0.36, Math.random()),
          depth: layer.depth,
          alpha: layer.alpha * lerp(0.8, 1.15, Math.random()),
          seed: lIdx * 11 + i * 3.7
        });
      }
    });

    // Partikel melayang (kelopak / debu cahaya / daun kecil) dengan variasi kedalaman
    const particleCount = Math.min(48, Math.max(22, Math.floor((width * height) / 38000)));
    for (let i = 0; i < particleCount; i++) {
      const zDepth = lerp(0.3, 1.2, Math.random()); // makin besar = makin dekat
      state.particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: lerp(2.2, 5.2, Math.random()) * zDepth,
        fallSpeed: lerp(10, 24, Math.random()) * zDepth,
        swayAmp: lerp(10, 26, Math.random()) * zDepth,
        swayFreq: lerp(0.7, 1.5, Math.random()),
        rot: Math.random() * Math.PI * 2,
        rotSpeed: lerp(-1.2, 1.2, Math.random()),
        alpha: lerp(0.22, 0.62, Math.random()) * Math.min(1, zDepth),
        seed: Math.random() * 100,
        isPetal: Math.random() > 0.35
      });
    }

    state.initialized = true;
  }

  function update(dt, width, height) {
    if (!state.initialized) init(width, height);

    const safeDt = Math.min(dt, 0.05);
    state.time += safeDt;

    // Angin berhembus pelan lalu sesekali menguat halus
    const targetGust = Math.max(0, organicWave(state.time, 0.28, 4.2)) * 22;
    state.windGust = lerp(state.windGust, targetGust, safeDt * 1.5);
    const currentWind = state.windBase + state.windGust;

    // Cahaya matahari lembut berdenyut perlahan
    const targetRayAlpha = 0.06 + (organicWave(state.time, 0.35, 1.1) * 0.5 + 0.5) * 0.05;
    state.sunRaysAlpha = lerp(state.sunRaysAlpha, targetRayAlpha, safeDt * 2);

    // Update awan per lapisan parallax
    for (const c of state.clouds) {
      const bob = organicWave(state.time, 0.45, c.seed) * 4 * c.depth;
      c.x += currentWind * c.depth * safeDt;
      c._renderY = c.y + bob;

      if (c.x - c.w > width + 160) {
        c.x = -c.w - 160;
        c.y = height * lerp(0.08, 0.38, Math.random());
      }
    }

    // Update partikel melayang dengan angin + ayunan + rotasi
    for (const p of state.particles) {
      const sway = Math.sin(state.time * p.swayFreq + p.seed) * p.swayAmp;
      p.x += (currentWind * 0.65 + sway * 0.45) * safeDt;
      p.y += p.fallSpeed * safeDt;
      p.rot += p.rotSpeed * safeDt;

      // Wrap halus saat keluar batas layar
      if (p.y > height + 30) {
        p.y = -25;
        p.x = Math.random() * (width + 120) - 60;
      }
      if (p.x > width + 80) {
        p.x = -70;
      } else if (p.x < -80) {
        p.x = width + 70;
      }
    }
  }

  function drawSkyAtmosphere(ctx, width, height) {
    ctx.save();
    // Sinar cahaya diagonal lembut dari pojok kanan atas
    const grad = ctx.createLinearGradient(width * 0.85, 0, width * 0.15, height * 0.75);
    grad.addColorStop(0, `rgba(255, 248, 224, ${state.sunRaysAlpha})`);
    grad.addColorStop(0.5, `rgba(255, 244, 214, ${state.sunRaysAlpha * 0.45})`);
    grad.addColorStop(1, "rgba(255, 248, 224, 0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
    ctx.restore();
  }

  function drawClouds(ctx) {
    for (const c of state.clouds) {
      ctx.save();
      ctx.translate(c.x, c._renderY ?? c.y);
      ctx.globalAlpha = c.alpha;

      // Gumpalan lembut berlapis agar tidak terlihat seperti lingkaran/oval kaku
      const grad = ctx.createLinearGradient(0, -c.h * 0.5, 0, c.h * 0.6);
      grad.addColorStop(0, "rgba(255, 253, 248, 0.95)");
      grad.addColorStop(1, "rgba(236, 228, 214, 0.35)");
      ctx.fillStyle = grad;

      ctx.beginPath();
      ctx.ellipse(0, 0, c.w * 0.5, c.h * 0.38, 0, 0, Math.PI * 2);
      ctx.ellipse(-c.w * 0.22, c.h * 0.06, c.w * 0.32, c.h * 0.28, 0, 0, Math.PI * 2);
      ctx.ellipse(c.w * 0.23, c.h * 0.08, c.w * 0.34, c.h * 0.27, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  function drawParticles(ctx) {
    for (const p of state.particles) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;

      if (p.isPetal) {
        // Bentuk kelopak/daun melengkung lembut
        ctx.fillStyle = "#FFF6E5";
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.quadraticCurveTo(p.size * 0.9, 0, 0, p.size);
        ctx.quadraticCurveTo(-p.size * 0.9, 0, 0, -p.size);
        ctx.fill();
      } else {
        // Titik cahaya hangat (sunlit mote / bokeh lembut)
        const rad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size * 1.4);
        rad.addColorStop(0, "rgba(255, 250, 232, 0.95)");
        rad.addColorStop(1, "rgba(255, 250, 232, 0)");
        ctx.fillStyle = rad;
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 1.4, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  function renderBehindForeground(ctx, width, height, dt) {
    update(dt, width, height);
    drawSkyAtmosphere(ctx, width, height);
    drawClouds(ctx);
  }

  function renderForegroundParticles(ctx) {
    drawParticles(ctx);
  }

  function handleResize(width, height) {
    init(width, height);
  }

  return {
    renderBehindForeground,
    renderForegroundParticles,
    handleResize
  };
})();
function animateLoop(timestamp) {
  const dt = Math.min(0.05, (timestamp - lastTime) / 1000 || 0.016);
  lastTime = timestamp;
  GAME_STATE.animTime += dt;
  const t = GAME_STATE.animTime;

  ctx.clearRect(0, 0, W, H);

  switch (GAME_STATE.scene) {
    case 'TITLE':
      renderFukuokaMorning(t);
      break;
    case 'DECLINED':
      renderDeclinedNight(t);
      break;
    case 'STATION':
      renderStationArrival(t);
      break;
    case 'TRAIN':
      renderInsideTrain(t);
      break;
    case 'FUJI':
      renderMountFujiScene(t);
      break;
    case 'KAMAKURA':
      renderKamakuraScene(t);
      break;
    case 'SHRINE':
      renderShrineScene(t);
      break;
    case 'SUWA':
      renderLakeSuwaScene(t);
      break;
  }

  requestAnimationFrame(animateLoop);
}

window.onload = function () {
  goToScene('TITLE');
  requestAnimationFrame(animateLoop);
};
let isUiClosed = false;

function toggleUiLayer() {
  const uiLayer = document.getElementById("uiLayer");
  const icon = document.getElementById("toggleUiIcon");

    if (icon) icon.textContent = "☰";

  } else {
    uiLayer.classList.remove("hud-hidden");
    if (icon) icon.textContent = "✕";
    if (label) label.textContent = "Tutup Menu";
  }
}

    linear-gradient(180deg,rgba(255,252,245,.85),rgba(195,219,244,.65));
  border-radius:45px;
  filter:blur(6px);
}

/* Perbukitan dengan perspektif kabut kejauhan */
.hills.back{
  background:linear-gradient(180deg,#7aa5cc 0%,#9ec4c9 55%,#9dc29b 100%);
  opacity:.95;
  filter:blur(.6px);
}
.hills{
  background:linear-gradient(180deg,#7cb06c 0%,#568c54 58%,#3c6943 100%);
  box-shadow:inset 0 10px 22px rgba(255,248,214,.38);
}

/* Kota & jalan */
.building{
  background:linear-gradient(120deg,#f5efe4 0%,#d5dfe3 52%,#8fa9ba 100%);
  border:1px solid rgba(255,255,255,.65);
  border-radius:3px 3px 0 0;
  box-shadow:-8px 0 18px rgba(34,62,88,.18);
}
.building:after{
  background:
    repeating-linear-gradient(90deg,rgba(88,146,184,.78) 0 6px,transparent 6px 14px),
    repeating-linear-gradient(0deg,transparent 0 14px,rgba(255,246,214,.92) 14px 17px);
}
.road{
  background:linear-gradient(180deg,#778b96 0%,#4b5b66 100%);
  box-shadow:inset 0 4px 14px rgba(0,0,0,.22);
}
.road:after{
  content:"";
  position:absolute;
  top:0;
  left:49%;
  width:2%;
  height:100%;
  background:repeating-linear-gradient(180deg,#fff4cf 0 14px,transparent 14px 28px);
  opacity:.78;
}

/* Pemandangan kereta */
.landscape{
  border:14px solid #e6dac8;
  box-shadow:inset 0 0 40px rgba(35,62,88,.28),0 10px 24px rgba(0,0,0,.15);
  background:linear-gradient(180deg,#498fd8 0%,#9ed0f5 52%,#cbe3b4 53%,#9ac479 100%);
}
.landscape .mount{
  background:linear-gradient(180deg,#5b88a8 0%,#7fa898 100%);
}
.landscape .fields{
  background:
    linear-gradient(180deg,rgba(255,250,220,.28),rgba(48,84,45,.28)),
    repeating-linear-gradient(12deg,#7fa85e 0 16px,#a9c974 17px 34px);
}
.seat{
  background:linear-gradient(180deg,#9c8776 0%,#6c5b4e 100%);
  box-shadow:inset 0 6px 14px rgba(255,248,230,.24);
}

/* Gunung Fuji */
.mountain{
  background:linear-gradient(102deg,#3c638a 0%,#6893b5 49%,#b6d3e3 52%,#e4f1f7 100%);
  filter:drop-shadow(0 14px 26px rgba(36,64,90,.28));
}
.mountain:after{
  background:linear-gradient(180deg,#ffffff 0%,#f0f7fc 72%,#c8dfed 100%);
}

/* Laut Kamakura */
.sea{
  background:
    radial-gradient(ellipse at 52% 10%,rgba(255,250,220,.72) 0%,rgba(255,235,175,.22) 32%,transparent 62%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.28) 0 2px,transparent 3px 13px),
    linear-gradient(180deg,#2d7eb3 0%,#4fa0c7 45%,#8bd0db 86%,#eadec5 100%);
}

/* Kuil Kawagoe */
.temple{
  background:linear-gradient(180deg,#f3e5cb 0%,#cfb48a 100%);
  border:6px solid #753f34;
  box-shadow:0 14px 28px rgba(52,35,28,.28);
}
.temple:before{
  background:linear-gradient(180deg,#612b25 0%,#9e483c 68%,#4e221d 100%);
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.28));
}

/* Senja Danau Suwa (Twilight Shinkai vibe) */
.sunset{
  width:138px;
  height:138px;
  background:radial-gradient(circle,#fff9e3 12%,#ffcf7d 46%,rgba(255,152,92,.35) 70%,rgba(255,152,92,0) 82%);
  box-shadow:0 0 100px 36px rgba(255,192,112,.72),0 0 170px 65px rgba(108,136,214,.32);
}

/* Cahaya / partikel melayang lembut */
.shinkai-spark{
  position:absolute;
  z-index:2;
  border-radius:50%;
  background:radial-gradient(circle,#ffffff 0%,rgba(255,244,195,.85) 45%,rgba(255,244,195,0) 75%);
  pointer-events:none;
  animation:sparkDrift linear infinite;
}
@keyframes sparkDrift{
  0%{transform:translate(0,0) scale(.6);opacity:0}
  20%{opacity:.85}
  80%{opacity:.65}
  100%{transform:translate(45px,-90px) scale(1.15);opacity:0}
}
</style>

<style>
/* Nuansa pencahayaan & atmosfer Kimi no Na wa di lapisan latar */
body{
  background:
    radial-gradient(circle at 82% 14%, rgba(255,252,224,.92) 0%, rgba(255,228,158,.45) 16%, rgba(255,220,140,0) 36%),
    linear-gradient(180deg, #2d73c7 0%, #5da2e8 38%, #a2d2f5 72%, #e2f1ea 100%) !important;
}
.shinkai-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  overflow:hidden;
}
.shinkai-flare{
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(circle at 80% 15%, rgba(255,250,220,.38) 0%, rgba(255,235,175,.12) 26%, transparent 55%),
    conic-gradient(from 115deg at 80% 15%, transparent 0deg, rgba(255,248,214,.14) 14deg, transparent 30deg, rgba(185,232,255,.12) 48deg, transparent 72deg);
  mix-blend-mode:screen;
}
.shinkai-cloud{
  position:absolute;
  border-radius:50px;
  filter:blur(6px);
  animation:shinkaiCloudMove linear infinite;
}
@keyframes shinkaiCloudMove{
  0%{transform:translateX(-25%)}
  100%{transform:translateX(125vw)}
}
.shinkai-mote{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle,#ffffff 0%,rgba(255,245,196,.85) 45%,rgba(255,245,196,0) 75%);
  animation:shinkaiMoteFloat linear infinite;
}
@keyframes shinkaiMoteFloat{
  0%{transform:translate(0,0) scale(.6);opacity:0}
  20%{opacity:.85}
  80%{opacity:.65}
  100%{transform:translate(50px,-95px) scale(1.15);opacity:0}
}
</style>

<script>
(function(){
  if (document.querySelector('.shinkai-layer')) return;
  const layer = document.createElement('div');
  layer.className = 'shinkai-layer';

  const flare = document.createElement('div');
  flare.className = 'shinkai-flare';
  layer.appendChild(flare);

  const cloudConfigs = [
    { top: '12%', w: 260, h: 68, dur: '46s', delay: '-10s', op: 0.72 },
    { top: '24%', w: 340, h: 82, dur: '58s', delay: '-28s', op: 0.58 }
  ];
  cloudConfigs.forEach(cfg => {
    const c = document.createElement('div');
    c.className = 'shinkai-cloud';
    c.style.top = cfg.top;
    c.style.left = '-20%';
    c.style.width = cfg.w + 'px';
    c.style.height = cfg.h + 'px';
    c.style.opacity = cfg.op;
    c.style.background = 'radial-gradient(circle at 25% 65%, rgba(255,255,255,.95) 0 36px, transparent 38px), radial-gradient(circle at 52% 42%, rgba(255,255,255,.98) 0 46px, transparent 48px), radial-gradient(circle at 76% 62%, rgba(220,238,255,.9) 0 34px, transparent 36px)';
    c.style.animationDuration = cfg.dur;
    c.style.animationDelay = cfg.delay;
    layer.appendChild(c);
  });

  for (let i = 0; i < 18; i++) {
    const m = document.createElement('span');
    m.className = 'shinkai-mote';
    const sz = 4 + Math.random() * 6;
    m.style.width = sz + 'px';
    m.style.height = sz + 'px';
    m.style.left = (Math.random() * 95) + '%';
    m.style.top = (25 + Math.random() * 68) + '%';
    m.style.animationDuration = (6 + Math.random() * 7) + 's';
    m.style.animationDelay = (-Math.random() * 8) + 's';
    layer.appendChild(m);
  }

  document.body.appendChild(layer);
})();
</script>

  <audio id="bgm" src="./bgm.trip.mpeg" loop preload="auto"></audio>
  <button id="musicBtn" type="button" onclick="toggleMusic()">Play Music</button>

</body>
</html>
